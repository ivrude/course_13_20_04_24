{% extends "base.html" %}

{% block title %}Оплата{% endblock %}

{% block content %}
<div class="payment-wrapper">
    <div class="payment-card">
        <h2>Оплата замовлення</h2>
        <p class="payment-description">
            Після натискання кнопки ви будете перенаправлені на сторінку LiqPay для завершення платежу.
        </p>

        <form method="POST" action="https://www.liqpay.ua/api/3/checkout">
            <input type="hidden" name="data" value="{{ data }}">
            <input type="hidden" name="signature" value="{{ signature }}">

            <button type="submit" class="pay-button">
                💳 Оплатити через LiqPay
            </button>
        </form>
    </div>
</div>
{% endblock %}
