version: "3.9"

services:
  web:
    build: .
    container_name: django_app
    command: python courses_project/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - DEBUG=1

  redis:
    image: redis:7
    container_name: redis_container
    ports:
      - "6379:6379"
